name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Casks/**'
      - 'Formula/**'
      - 'packages/manifest.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.pr.outputs.pull_request_number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_repo: ${{ steps.pr.outputs.base_repo }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      author: ${{ steps.pr.outputs.author }}
      has_auto_merge_label: ${{ steps.pr.outputs.has_auto_merge_label }}
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || Number(context.payload.inputs?.pull_request_number);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${context.payload.inputs?.pull_request_number}`);
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            core.setOutput('pull_request_number', String(pr.number));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_repo', pr.base.repo.full_name);
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('author', pr.user.login);
            core.setOutput('has_auto_merge_label', String(labels.some(label => label.name === 'auto-merge/package-update')));

  validate-package-pr:
    needs: resolve-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate manifest
        run: ruby scripts/validate-manifest.rb

      - name: Verify changed package files and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: ruby scripts/review-package-pr.rb --base "$BASE_SHA" --head "$HEAD_SHA"

  auto-merge-eligibility:
    name: Auto-merge eligibility
    needs: resolve-pr
    if: ${{ needs.resolve-pr.outputs.has_auto_merge_label == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate automatic package update
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
          BASE_REPO: ${{ needs.resolve-pr.outputs.base_repo }}
          HEAD_REPO: ${{ needs.resolve-pr.outputs.head_repo }}
          AUTHOR: ${{ needs.resolve-pr.outputs.author }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          test "$BASE_REPO" = "$EXPECTED_REPO"
          test "$HEAD_REPO" = "$EXPECTED_REPO"
          test "$AUTHOR" = "github-actions[bot]"
          ruby scripts/check-auto-merge-eligibility.rb --base "$BASE_SHA" --head "$HEAD_SHA"

  brew-smoke-test:
    needs: [resolve-pr, validate-package-pr]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed package files
        id: changed
        run: |
          base=$(git merge-base "${{ needs.resolve-pr.outputs.base_sha }}" "${{ needs.resolve-pr.outputs.head_sha }}")
          files=$(git diff --name-only --diff-filter=ACMR "$base" "${{ needs.resolve-pr.outputs.head_sha }}" -- 'Formula/**' 'Casks/**' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Setup tap checkout
        if: steps.changed.outputs.files != ''
        run: |
          brew update
          brew tap samzong/tap "https://github.com/${{ needs.resolve-pr.outputs.head_repo }}.git"
          brew trust samzong/tap
          cd "$(brew --repository samzong/tap)"
          git checkout "${{ needs.resolve-pr.outputs.head_sha }}"

      - name: Smoke test package installation
        if: steps.changed.outputs.files != ''
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            if [[ $file == Casks/* ]]; then
              token=$(basename "$file" .rb)
              echo "Testing cask: $token"
              brew install --cask --force "samzong/tap/$token"
            elif [[ $file == Formula/* ]]; then
              token=$(basename "$file" .rb)
              echo "Testing formula: $token"
              brew install "samzong/tap/$token"
              brew test "samzong/tap/$token"
            fi
          done

  auto-merge:
    name: Auto-merge package update
    needs: [resolve-pr, validate-package-pr, auto-merge-eligibility, brew-smoke-test]
    if: >
      always() &&
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.has_auto_merge_label == 'true' &&
      needs.validate-package-pr.result == 'success' &&
      needs.auto-merge-eligibility.result == 'success' &&
      needs.brew-smoke-test.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-package-pr-${{ needs.resolve-pr.outputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Squash-merge eligible package update
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const autoMergeLabel = 'auto-merge/package-update';
            const prNumber = Number('${{ needs.resolve-pr.outputs.pull_request_number }}');
            const expectedSha = '${{ needs.resolve-pr.outputs.head_sha }}';
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            let pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;

            if (pr.state !== 'open') {
              console.log(`PR #${prNumber} is ${pr.state}; skipping auto-merge.`);
              return;
            }

            if (pr.head.sha !== expectedSha) {
              core.setFailed(
                `PR #${prNumber} head moved during review: expected ${expectedSha}, got ${pr.head.sha}`
              );
              return;
            }

            let delay = 5000;
            for (let attempt = 0; attempt < 5 && pr.mergeable === null; attempt++) {
              console.log(`PR #${prNumber} mergeability still computing; waiting ${delay}ms...`);
              await sleep(delay);
              delay = Math.min(delay * 2, 30000);
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            }

            if (!pr.mergeable) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: '⚠️ Automatic merge failed: This PR cannot be merged at the moment. Please resolve conflicts and re-run PR Review.'
              });
              core.setFailed(`PR #${prNumber} is not mergeable`);
              return;
            }

            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });
            if (!labels.some(label => label.name === autoMergeLabel)) {
              console.log(`PR #${prNumber} no longer has ${autoMergeLabel}; skipping auto-merge.`);
              return;
            }

            let result;
            try {
              ({ data: result } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                sha: expectedSha,
                merge_method: 'squash',
                commit_title: pr.title
              }));
            } catch (error) {
              const message = error.message || 'Automatic merge failed';
              if (/already merged|not open|Pull Request is not mergeable/i.test(message) && (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data.merged) {
                console.log(`PR #${prNumber} already merged; treating as success.`);
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `❌ Automatic merge failed: ${message}`
              });
              core.setFailed(message);
              return;
            }

            if (!result.merged) {
              core.setFailed(`PR #${prNumber} was not merged: ${result.message}`);
              return;
            }

            console.log(`Successfully squash-merged PR #${prNumber}`);
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'update-readme.yml',
                ref: pr.base.ref
              });
            } catch (error) {
              core.setFailed(`PR #${prNumber} merged, but Update README dispatch failed: ${error.message}`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: '🎉 Automatic merge successful: This PR has been automatically squash-merged into the target branch.'
            });
