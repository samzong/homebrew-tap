# Manifest-driven update rules for existing Homebrew Formula/Cask files.
# The first .rb file for a package is still authored manually. This manifest only
# tells the updater how to refresh version and SHA256 values for later releases.
packages:
  adit:
    type: cask
    source_repo: samzong/adit
    path: Casks/adit.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: Adit-{version}-arm64.dmg
        block: on_arm

  combe:
    type: cask
    source_repo: samzong/combe
    path: Casks/combe.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: Combe-v{version}-macos-arm64.zip
        block: on_arm

  configforge:
    type: cask
    source_repo: samzong/ConfigForge
    path: Casks/configforge.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: ConfigForge-{version}-arm64.dmg
        block: on_arm
        update_url: true
      x86_64:
        filename: ConfigForge-{version}-x86_64.dmg
        block: on_intel
        update_url: true

  etui:
    type: cask
    source_repo: samzong/Etui
    path: Casks/etui.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: Etui-{version}-arm64.dmg
        block: on_arm

  hf-model-downloader:
    type: cask
    source_repo: samzong/hf-model-downloader
    path: Casks/hf-model-downloader.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: hf-model-downloader-arm64.dmg
        block: on_arm

  logo-wallpaper:
    type: cask
    source_repo: samzong/LogoWallpaper
    path: Casks/logo-wallpaper.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: LogoWallpaper-{version}-arm64.dmg
        block: on_arm
        update_url: true
      x86_64:
        filename: LogoWallpaper-{version}-x86_64.dmg
        block: on_intel
        update_url: true

  lunt:
    type: cask
    source_repo: samzong/lunt
    path: Casks/lunt.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: Lunt-{version}-arm64.dmg
        block: on_arm

  mac-music-player:
    type: cask
    source_repo: samzong/MacMusicPlayer
    path: Casks/mac-music-player.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: MacMusicPlayer-{version}-arm64.dmg
        block: on_arm
        update_url: true

  mote:
    type: cask
    source_repo: samzong/mote
    path: Casks/mote.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: Mote-{version}-arm64.dmg
        block: on_arm
        update_url: true

  prompts:
    type: cask
    source_repo: samzong/prompts
    path: Casks/prompts.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: Prompts_{version}_aarch64.dmg
        block: on_arm
      x86_64:
        filename: Prompts_{version}_x64.dmg
        block: on_intel

  saveeye:
    type: cask
    source_repo: samzong/SaveEye
    path: Casks/saveeye.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: SaveEye-{version}-arm64.dmg
        block: on_arm

  spale:
    type: cask
    source_repo: samzong/spale
    path: Casks/spale.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      arm64:
        filename: spale-v{version}-macos-arm64.zip
        block: on_arm

  blueprint:
    type: formula
    source_repo: samzong/blueprint
    path: Formula/blueprint.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      universal:
        filename: samzong-blueprint-{version}.tgz
        url_match: samzong-blueprint-

  confer:
    type: formula
    source_repo: samzong/confer
    path: Formula/confer.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      darwin_arm64:
        filename: confer-v{version}-darwin-arm64.tar.gz
        url_match: darwin-arm64
      linux_x86_64:
        filename: confer-v{version}-linux-x86_64.tar.gz
        url_match: linux-x86_64

  gmc:
    type: formula
    source_repo: samzong/gmc
    path: Formula/gmc.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      darwin_arm64:
        filename: gmc_{version}_Darwin_arm64.tar.gz
        url_match: _Darwin_arm64.tar.gz
        update_url: true
      darwin_x86_64:
        filename: gmc_{version}_Darwin_x86_64.tar.gz
        url_match: _Darwin_x86_64.tar.gz
        update_url: true
      linux_arm64:
        filename: gmc_{version}_Linux_arm64.tar.gz
        url_match: _Linux_arm64.tar.gz
        update_url: true
      linux_x86_64:
        filename: gmc_{version}_Linux_x86_64.tar.gz
        url_match: _Linux_x86_64.tar.gz
        update_url: true

  gofs:
    type: formula
    source_repo: samzong/gofs
    path: Formula/gofs.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      darwin_x86_64:
        filename: gofs_Darwin_x86_64.tar.gz
        url_match: gofs_Darwin_x86_64.tar.gz
      darwin_arm64:
        filename: gofs_Darwin_arm64.tar.gz
        url_match: gofs_Darwin_arm64.tar.gz
      linux_x86_64:
        filename: gofs_Linux_x86_64.tar.gz
        url_match: gofs_Linux_x86_64.tar.gz
      linux_arm64:
        filename: gofs_Linux_arm64.tar.gz
        url_match: gofs_Linux_arm64.tar.gz

  mdctl:
    type: formula
    source_repo: samzong/mdctl
    path: Formula/mdctl.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      darwin_arm64:
        filename: mdctl_Darwin_arm64.tar.gz
        url_match: mdctl_Darwin_arm64.tar.gz
      darwin_x86_64:
        filename: mdctl_Darwin_x86_64.tar.gz
        url_match: mdctl_Darwin_x86_64.tar.gz
      linux_arm64:
        filename: mdctl_Linux_arm64.tar.gz
        url_match: mdctl_Linux_arm64.tar.gz
      linux_x86_64:
        filename: mdctl_Linux_x86_64.tar.gz
        url_match: mdctl_Linux_x86_64.tar.gz

  recall:
    type: formula
    source_repo: samzong/Recall
    path: Formula/recall.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      macos_arm64:
        filename: recall-macos-aarch64.tar.gz
        url_match: recall-macos-aarch64.tar.gz
      macos_x86_64:
        filename: recall-macos-x86_64.tar.gz
        url_match: recall-macos-x86_64.tar.gz
      linux_x86_64:
        filename: recall-linux-x86_64.tar.gz
        url_match: recall-linux-x86_64.tar.gz

  rx:
    type: formula
    source_repo: samzong/rx
    path: Formula/rx.rb
    version_prefix: v
    auto_bump_on_scan: true
    assets:
      macos_arm64:
        filename: rx-macos-aarch64.tar.gz
        url_match: rx-macos-aarch64.tar.gz
      macos_x86_64:
        filename: rx-macos-x86_64.tar.gz
        url_match: rx-macos-x86_64.tar.gz
      linux_x86_64:
        filename: rx-linux-x86_64.tar.gz
        url_match: rx-linux-x86_64.tar.gz
